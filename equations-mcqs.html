<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 6 Equations MCQs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f0f8ff;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .year-selector {
            margin: 20px 0;
        }

        .year-selector label {
            font-weight: bold;
            margin-right: 10px;
        }

        select {
            margin: 10px;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .timer {
            font-size: 18px;
            margin: 10px 0;
            color: #2c3e50;
            font-weight: bold;
        }

        .progress-container {
            margin: 20px auto;
            width: 80%;
            max-width: 500px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .progress-fill {
            height: 100%;
            background: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }

        .questions-container {
            margin: 20px auto;
            max-width: 800px;
            text-align: left;
        }

        .question {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .question-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .equation {
            display: inline-block;
            font-size: 1.3em;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #e9ecef;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1em;
            font-weight: 500;
        }

        .option:hover {
            background: #e9ecef;
            border-color: #3498db;
        }

        .option.selected {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }

        .option.correct {
            background: #28a745;
            color: white;
            border-color: #1e7e34;
        }

        .option.incorrect {
            background: #dc3545;
            color: white;
            border-color: #c82333;
        }

        .submit-container {
            margin: 20px 0;
            display: none;
        }

        .submit-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #2980b9;
        }

        .submit-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .results-container {
            margin: 20px auto;
            max-width: 800px;
            text-align: left;
        }

        .score {
            font-size: 1.8em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .feedback {
            background: white;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .feedback-item {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid;
        }

        .feedback-item.correct {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .feedback-item.incorrect {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .explanation {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0,0,0,0.05);
            border-radius: 3px;
            font-style: italic;
            font-size: 14px;
        }

        .back-btn {
            display: inline-block;
            background: #3498db;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
            margin: 10px;
        }

        .back-btn:hover {
            background: #2980b9;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>

            <div class="year-selector">
                <label for="yearSelect">Select Year:</label>
                <select id="yearSelect">
                    <option value="">-- Select --</option>
                    <option value="6">Year 6</option>

            </div>
            <div class="timer" id="timer">30:00</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-number" id="answeredCount">0</div>
                <div class="stat-label">Answered</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalCount">0</div>

        </div>
        
        <div class="results-container" id="resultsContainer" style="display: none;">
            <div class="score" id="score"></div>
            <div id="feedback"></div>
            <a href="index.html" class="back-btn">← Back to Main Menu</a>

                explanation: "n + n = 2n simplifies to 2n = 2n, which is an identity true for all values of n."

        let questions = [];
        let timerInterval;
        let isSubmitted = false;
        let selectedAnswers = {};

        function generateQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((question, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="question-title">Question ${question.id}</div>
                    <div class="equation">${question.equation}</div>
                    <div class="options">
                        ${question.options.map((option, optionIndex) => `
                            <div class="option" data-question="${question.id}" data-option="${optionIndex}" onclick="selectOption(${question.id}, ${optionIndex})">
                                ${option}
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(questionDiv);
            });
        }

        function selectOption(questionId, optionIndex) {
            if (isSubmitted) return;
            
            // Remove previous selection for this question
            const questionOptions = document.querySelectorAll(`[data-question="${questionId}"]`);
            questionOptions.forEach(option => option.classList.remove('selected'));
            
            // Add selection to clicked option
            const selectedOption = document.querySelector(`[data-question="${questionId}"][data-option="${optionIndex}"]`);
            selectedOption.classList.add('selected');
            
            // Store the answer
            selectedAnswers[questionId] = optionIndex;
            
            updateProgress();
        }

        function startTimer() {
            const timerElement = document.getElementById('timer');
            let timeLeft = 1800; // 30 minutes in seconds
            
            timerInterval = setInterval(() => {
                timeLeft--;
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswers();
                }
            }, 1000);
        }

        function updateProgress() {
            const progressFill = document.getElementById('progressFill');
            const answeredCount = Object.keys(selectedAnswers).length;
            const totalCount = questions.length;
            const percentage = (answeredCount / totalCount) * 100;
            
            progressFill.style.width = `${percentage}%`;
            
            // Update stats
            document.getElementById('answeredCount').textContent = answeredCount;
            document.getElementById('totalCount').textContent = totalCount;
        }

        function submitAnswers() {
            if (isSubmitted) return;
            isSubmitted = true;
            
            clearInterval(timerInterval);
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitted';
            
            let correct = 0;
            let total = questions.length;
            
            // Show correct/incorrect answers
            questions.forEach(question => {
                const userAnswer = selectedAnswers[question.id];
                const isCorrect = userAnswer === question.correct;
                
                if (isCorrect) correct++;
                
                // Highlight options
                const questionOptions = document.querySelectorAll(`[data-question="${question.id}"]`);
                questionOptions.forEach((option, index) => {
                    if (index === question.correct) {
                        option.classList.add('correct');
                    } else if (index === userAnswer && !isCorrect) {
                        option.classList.add('incorrect');
                    }
                });
            });
            
            displayResults(correct, total);
        }

        function displayResults(correct, total) {
            const resultsContainer = document.getElementById('resultsContainer');
            const scoreElement = document.getElementById('score');
            const feedbackElement = document.getElementById('feedback');
            
            const percentage = Math.round((correct / total) * 100);
            let grade = '';
            let gradeColor = '';
            
            if (percentage >= 90) {
                grade = 'Excellent! 🌟';
                gradeColor = '#28a745';
            } else if (percentage >= 80) {
                grade = 'Very Good! 👍';
                gradeColor = '#20c997';
            } else if (percentage >= 70) {
                grade = 'Good! ✅';
                gradeColor = '#17a2b8';
            } else if (percentage >= 60) {
                grade = 'Satisfactory 📚';
                gradeColor = '#ffc107';
            } else {
                grade = 'Keep Practicing! 💪';
                gradeColor = '#dc3545';
            }
            
            scoreElement.innerHTML = `
                <div style="color: ${gradeColor};">${grade}</div>
                <div>Score: ${correct}/${total} (${percentage}%)</div>
            `;
            
            let feedbackHTML = '';
            questions.forEach(question => {
                const userAnswer = selectedAnswers[question.id];
                const isCorrect = userAnswer === question.correct;
                const statusClass = isCorrect ? 'correct' : 'incorrect';
                const statusText = isCorrect ? '✓ Correct' : '✗ Incorrect';
                const userAnswerText = userAnswer !== undefined ? question.options[userAnswer] : 'Not answered';
                
                feedbackHTML += `
                    <div class="feedback-item ${statusClass}">
                        <strong>Question ${question.id}: ${question.equation}</strong><br>
                        <strong>Your answer:</strong> ${userAnswerText}<br>
                        <strong>Correct answer:</strong> ${question.options[question.correct]}<br>
                        <strong>Status:</strong> ${statusText}
                        ${!isCorrect ? `<div class="explanation">${question.explanation}</div>` : ''}
                    </div>
                `;
            });
            
            feedbackElement.innerHTML = feedbackHTML;
            resultsContainer.style.display = 'block';
            resultsContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            const yearSelect = document.getElementById('yearSelect');
            const timerElement = document.getElementById('timer');
            const progressFill = document.getElementById('progressFill');

            yearSelect.addEventListener('change', function() {
                // Reset UI/state
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isSubmitted = false;
                selectedAnswers = {};
                document.getElementById('resultsContainer').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = 'Submit Answers';
                timerElement.textContent = '30:00';
                progressFill.style.width = '0%';
                document.getElementById('stats').style.display = 'none';

                // Load selected year
                if (this.value === '6') {
                    questions = questionsYear6;
                    generateQuestions();
                    startTimer();
                    updateProgress();
                    
                    // Show submit button and stats after year selection
                    document.querySelector('.submit-container').style.display = 'block';
                    document.getElementById('stats').style.display = 'flex';
                } else {
                    questions = [];
                    const container = document.getElementById('questionsContainer');
                    container.innerHTML = '';
                    
                    // Hide submit button and stats when no year is selected
                    document.querySelector('.submit-container').style.display = 'none';
                    document.getElementById('stats').style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
